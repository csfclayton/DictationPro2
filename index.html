<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>填充練字坊 · DictationPro2</title>
<style>
:root{--bg:#0b1220;--card:rgba(30,41,59,.9);--primary:#6366f1;--success:#34d399;--danger:#f87171;--warning:#fbbf24;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:radial-gradient(ellipse at top,#1e1b4b,#0b1220 55%,#020617);color:var(--text);min-height:100vh}.container{max-width:720px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;border:none;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}.btn-block{width:100%}.btn-danger{background:#ef4444;color:#fff}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-size:16px}label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}.form-group{margin-bottom:14px}.hidden{display:none!important}.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted);font-size:.9rem}.header{text-align:center;padding:24px 0 16px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat-item{background:rgba(255,255,255,.04);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--border)}.stat-item .num{font-size:1.3rem;font-weight:700}.option-btn{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:16px;cursor:pointer}.option-btn.correct{background:rgba(52,211,153,.18);border-color:var(--success)}.option-btn.wrong{background:rgba(248,113,113,.18);border-color:var(--danger)}.progress-bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#a78bfa);transition:width .3s}.screen{display:none}.screen.active{display:block}.warning-box{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);border-radius:14px;padding:12px 16px;font-size:.88rem;color:#fcd34d;margin-bottom:14px}.mode-btn.active{background:rgba(99,102,241,.3);border-color:rgba(99,102,241,.5)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);padding:12px 22px;border-radius:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}.mic-btn{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;font-size:34px;cursor:pointer}.mic-btn.listening{background:linear-gradient(135deg,#ef4444,#dc2626)}.word-blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #818cf8;margin:0 3px;color:#818cf8;font-weight:700}.question-text{font-size:1.2rem;line-height:1.85;margin-bottom:20px}.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600}.badge-n{background:rgba(148,163,184,.25);color:#cbd5e1}.badge-r{background:rgba(59,130,246,.25);color:#93c5fd}.badge-sr{background:rgba(168,85,247,.25);color:#d8b4fe}.badge-ssr{background:rgba(245,158,11,.3);color:#fcd34d}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.collect-card{background:rgba(0,0,0,.3);border-radius:16px;padding:14px;border:1px solid var(--border);text-align:center}.collect-card.locked{opacity:.45;filter:grayscale(.6)}.draw-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.draw-result{background:linear-gradient(160deg,#1e1b4b,#1e293b);border:1px solid rgba(167,139,250,.3);border-radius:24px;padding:32px 24px;text-align:center;max-width:340px;width:100%}.srs-due{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(239,68,68,.1));border:1px solid rgba(245,158,11,.3)}
</style>
</head>
<body>
<div class="container">
<div id="screen-home" class="screen active">
<div class="header"><h1>填充練字坊</h1><p class="muted">CSV · 抽卡 · SRS · 語音默書 · iPad</p></div>
<div class="warning-box">⚠️ 資料只存在本機。請定期備份 JSON。</div>
<div class="card"><div class="flex-between"><div><div class="muted">目前用戶</div><div style="font-size:1.25rem;font-weight:700" id="uname">尚未選擇</div></div><button class="btn btn-ghost" onclick="go('users')">切換帳戶</button></div>
<div class="stat-grid" id="ustats" style="display:none"><div class="stat-item"><div class="num" id="s-xp">0</div><div class="muted">XP</div></div><div class="stat-item"><div class="num" id="s-lv">入門</div><div class="muted">等級</div></div><div class="stat-item"><div class="num" id="s-card">0</div><div class="muted">圖鑑</div></div></div>
<div class="stat-grid" id="ustats2" style="display:none"><div class="stat-item"><div class="num" id="s-acc">0%</div><div class="muted">正確率</div></div><div class="stat-item"><div class="num" id="s-srs">0</div><div class="muted">待複習</div></div><div class="stat-item"><div class="num" id="s-draw">0</div><div class="muted">可抽卡</div></div></div></div>
<div class="card srs-due hidden" id="srs-banner"><div class="flex-between"><div><strong>📚 有詞彙需複習</strong><div class="muted" id="srs-txt"></div></div><button class="btn btn-primary" onclick="startSRS()">開始複習</button></div></div>
<div class="card"><h2 style="margin-bottom:12px">開始練習</h2>
<div class="form-group"><label>選擇題組</label><div id="glist"></div></div>
<div class="form-group"><label>模式</label><div class="grid-3">
<button class="btn btn-ghost mode-btn active" data-m="choice" onclick="setM('choice')">供詞<br><small>10選1</small></button>
<button class="btn btn-ghost mode-btn" data-m="free" onclick="setM('free')">不供詞</button>
<button class="btn btn-ghost mode-btn" data-m="speech" onclick="setM('speech')">語音默書</button></div></div>
<div class="form-group"><label>題數</label><select id="qcount"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="0">全部</option></select></div>
<button class="btn btn-primary btn-block" onclick="startQuiz()">✍️ 開始測驗</button></div>
<div class="grid-2">
<button class="btn btn-ghost" onclick="go('gallery')">🎴 圖鑑</button>
<button class="btn btn-ghost" onclick="tryDraw()">🎯 抽卡</button>
<button class="btn btn-ghost" onclick="go('bank')">📖 題庫</button>
<button class="btn btn-ghost" onclick="go('lb')">🏆 積分榜</button>
<button class="btn btn-ghost" onclick="go('backup')">💾 備份</button>
<button class="btn btn-ghost" onclick="go('settings')">⚙️ 設定</button></div>
</div>

<div id="screen-users" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>帳戶</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div><div id="ulist"></div>
<div class="card"><div class="form-group"><label>名稱</label><input id="nname" maxlength="20"/></div><button class="btn btn-primary btn-block" onclick="addUser()">建立</button></div></div>

<div id="screen-bank" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>題庫</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div>
<div class="card"><h2 style="margin-bottom:8px">CSV 匯入</h2><input type="file" id="csvf" accept=".csv" style="margin-bottom:8px"/><textarea id="csvp" rows="3" placeholder="貼上 CSV"></textarea>
<div class="form-group" style="margin-top:8px"><label>題組名</label><input id="ign"/></div><button class="btn btn-primary btn-block" onclick="impCSV()">匯入</button></div>
<div class="card"><h2 style="margin-bottom:8px">手動新增</h2>
<div class="form-group"><label>題組</label><select id="awg"></select></div>
<div class="form-group"><label>題目</label><input id="awq" placeholder="用 _____ 表示空白"/></div>
<div class="form-group"><label>答案</label><input id="awa"/></div>
<div class="grid-2"><div class="form-group"><label>拼音</label><input id="awp"/></div><div class="form-group"><label>釋義</label><input id="awd"/></div></div>
<button class="btn btn-primary btn-block" onclick="addWord()">新增</button></div>
<div class="card"><h2 style="margin-bottom:8px">題組列表</h2><div id="gl"></div>
<div class="form-group" style="margin-top:12px"><label>新增題組</label><div style="display:flex;gap:8px"><input id="ngn"/><button class="btn btn-primary" onclick="addGroup()">新增</button></div></div></div></div>

<div id="screen-gallery" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>圖鑑</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div>
<div class="card"><div class="flex-between" style="margin-bottom:12px"><span class="muted" id="gprog"></span><button class="btn btn-primary" onclick="tryDraw()">🎯 抽卡</button></div><div class="card-grid" id="ggrid"></div></div></div>

<div id="screen-quiz" class="screen"><div class="flex-between" style="margin-bottom:12px"><div class="muted" id="qprog"></div><button class="btn btn-ghost" onclick="if(confirm('結束?'))go('home')">結束</button></div>
<div class="progress-bar"><div class="progress-fill" id="qbar" style="width:0%"></div></div>
<div class="card" style="margin-top:16px"><div class="muted" id="qml" style="margin-bottom:8px"></div><div class="question-text" id="qq"></div><div id="qp" class="muted" style="margin-bottom:12px"></div>
<div id="choice"></div>
<div id="free" class="hidden"><input id="fi" placeholder="輸入答案"/><button class="btn btn-primary btn-block" style="margin-top:10px" onclick="subFree()">提交</button></div>
<div id="speech" class="hidden" style="text-align:center"><p class="muted" style="margin-bottom:12px">點擊麥克風</p><button class="mic-btn" id="mic" onclick="togSpeech()">🎤</button><div id="sres" style="margin-top:12px;min-height:28px"></div><button class="btn btn-primary" style="margin-top:10px" id="ssub" onclick="subSpeech()" disabled>確認</button></div>
<div id="fb" class="hidden" style="margin-top:16px;padding:14px;border-radius:14px"></div>
<button class="btn btn-primary btn-block hidden" id="nbtn" style="margin-top:10px" onclick="nextQ()">下一題 →</button></div></div>

<div id="screen-result" class="screen"><div class="header"><h1>完成！</h1></div>
<div class="card" style="text-align:center"><div class="stat-grid"><div class="stat-item"><div class="num" id="rc">0</div><div class="muted">答對</div></div><div class="stat-item"><div class="num" id="rt">0</div><div class="muted">總題</div></div><div class="stat-item"><div class="num" id="ra">0%</div><div class="muted">正確率</div></div></div>
<div style="margin:14px 0">獲得 <strong id="rx" style="color:var(--warning)">0</strong> XP</div>
<div id="rlu" class="hidden" style="color:var(--warning);font-weight:700">🎊 升級了！</div>
<div class="muted" id="rd" style="margin:10px 0"></div>
<button class="btn btn-primary btn-block" id="rdb" style="display:none" onclick="tryDraw()">🎯 抽卡</button>
<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="go('home')">返回</button>
<button class="btn btn-ghost btn-block" style="margin-top:6px" onclick="retryWrong()">錯題重做</button></div></div>

<div id="screen-lb" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>積分榜</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div><div class="card" id="lbl"></div></div>
<div id="screen-backup" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>備份</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div>
<div class="warning-box">換裝置請先匯出再匯入</div>
<div class="card"><button class="btn btn-primary btn-block" onclick="expB()">⬇ JSON 備份</button></div>
<div class="card"><input type="file" id="bf" accept=".json"/><button class="btn btn-danger btn-block" style="margin-top:10px" onclick="impB()">匯入覆蓋</button></div>
<div class="card"><button class="btn btn-ghost btn-block" onclick="expCSV()">⬇ CSV</button></div></div>
<div id="screen-settings" class="screen"><div class="flex-between" style="margin-bottom:16px"><h2>設定</h2><button class="btn btn-ghost" onclick="go('home')">←</button></div>
<div class="card"><div class="form-group"><label>語音語言</label><select id="slang"><option value="zh-HK">廣東話</option><option value="zh-TW">國語</option><option value="zh-CN">普通話</option></select></div>
<label><input type="checkbox" id="sfx" checked style="width:auto;margin-right:8px"/>音效</label></div></div>
</div>
<div class="toast" id="toast"></div><div id="dov" class="hidden"></div>
<script>
const SK='dp2_v3',LEVELS=[{n:'入門學徒',x:0},{n:'字詞新手',x:50},{n:'勤奮練習生',x:150},{n:'穩健學者',x:300},{n:'詞彙達人',x:500},{n:'語文高手',x:800},{n:'博學多聞',x:1200},{n:'詞庫宗師',x:1800},{n:'文辭泰斗',x:2500},{n:'一代文豪',x:3500}];
const RAR={N:{l:'N',w:55,c:'#94a3b8',b:'badge-n'},R:{l:'R',w:28,c:'#60a5fa',b:'badge-r'},SR:{l:'SR',w:13,c:'#c084fc',b:'badge-sr'},SSR:{l:'SSR',w:4,c:'#fbbf24',b:'badge-ssr'}};
const DCARDS=[{id:'c1',name:'言歸於好',rarity:'R',e:'🤝'},{id:'c2',name:'同甘共苦',rarity:'R',e:'💪'},{id:'c3',name:'情同手足',rarity:'SR',e:'👬'},{id:'c4',name:'鍥而不捨',rarity:'R',e:'🔥'},{id:'c5',name:'水滴石穿',rarity:'N',e:'💧'},{id:'c6',name:'畫龍點睛',rarity:'SR',e:'🐉'},{id:'c7',name:'一鳴驚人',rarity:'SSR',e:'🦅'},{id:'c8',name:'守株待兔',rarity:'N',e:'🐇'},{id:'c9',name:'亡羊補牢',rarity:'N',e:'🐑'},{id:'c10',name:'井底之蛙',rarity:'N',e:'🐸'},{id:'c11',name:'狐假虎威',rarity:'R',e:'🦊'},{id:'c12',name:'對牛彈琴',rarity:'N',e:'🐄'},{id:'c13',name:'刻舟求劍',rarity:'N',e:'⚔️'},{id:'c14',name:'掩耳盜鈴',rarity:'N',e:'🔔'},{id:'c15',name:'塞翁失馬',rarity:'SR',e:'🐴'},{id:'c16',name:'愚公移山',rarity:'SSR',e:'⛰️'},{id:'c17',name:'精衛填海',rarity:'SSR',e:'🌊'},{id:'c18',name:'臥薪嘗膽',rarity:'SR',e:'🗡️'},{id:'c19',name:'破釜沉舟',rarity:'R',e:'⛵'},{id:'c20',name:'背水一戰',rarity:'R',e:'🛡️'}];
let S={users:[],activeUserId:null,groups:[],cardPool:JSON.parse(JSON.stringify(DCARDS)),settings:{speechLang:'zh-HK',sfx:true}};
let Q={qs:[],i:0,ok:0,wrong:[],mode:'choice',done:false,srs:false},rec=null,listen=false;
function load(){try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S={...S,...p};if(!S.cardPool?.length)S.cardPool=JSON.parse(JSON.stringify(DCARDS))}}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){toast('儲存失敗')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function user(){return S.users.find(u=>u.id===S.activeUserId)||null}
function lvl(xp){let l=LEVELS[0];for(const x of LEVELS)if(xp>=x.x)l=x;return l}
function ensSRS(u,id){if(!u.srs)u.srs={};if(!u.srs[id])u.srs[id]={ease:2.5,interval:0,next:0,reps:0};return u.srs[id]}
function updSRS(u,id,ok){const s=ensSRS(u,id),now=Date.now();if(ok){if(s.reps===0)s.interval=1;else if(s.reps===1)s.interval=3;else s.interval=Math.round(s.interval*s.ease);s.ease=Math.min(3,s.ease+.1);s.reps++}else{s.interval=0;s.reps=0;s.ease=Math.max(1.3,s.ease-.2)}s.next=now+s.interval*864e5;if(s.interval===0)s.next=now}
function dueWords(u){if(!u)return[];const now=Date.now(),d=[];S.groups.forEach(g=>g.words.forEach(w=>{const s=u.srs?.[w.id];if(!s||s.next<=now)d.push({...w,gn:g.name})}));return d}
function owned(u){return u?.cards?Object.keys(u.cards).filter(k=>u.cards[k]>0).length:0}
function rollR(){const t=Object.values(RAR).reduce((s,r)=>s+r.w,0);let r=Math.random()*t;for(const[k,c]of Object.entries(RAR)){r-=c.w;if(r<=0)return k}return'N'}
function draw1(){const u=user();if(!u||(u.drawTickets||0)<1)return null;u.drawTickets--;const rar=rollR();let pool=S.cardPool.filter(c=>c.rarity===rar);if(!pool.length)pool=S.cardPool;const pick=pool[Math.floor(Math.random()*pool.length)];if(!u.cards)u.cards={};const isNew=!u.cards[pick.id];u.cards[pick.id]=(u.cards[pick.id]||0)+1;save();return{card:pick,isNew,rar}}
function tryDraw(){const u=user();if(!u)return toast('請先選帳戶');if((u.drawTickets||0)<1)return toast('沒有抽卡次數');const r=draw1();if(!r)return;showDraw(r);sfx('draw')}
function showDraw(r){const{card,isNew,rar}=r,c=RAR[rar],o=document.getElementById('dov');o.className='draw-modal';o.innerHTML=`<div class="draw-result"><div style="color:${c.c}">✨ ${c.l} ✨</div><div style="font-size:3rem;margin:12px 0">${card.e||'🎴'}</div><div style="font-size:1.5rem;font-weight:700;margin:8px 0">${card.name}</div>${isNew?'<div style="color:var(--success);font-weight:600">✨ NEW!</div>':'<div class="muted">重複卡 +1</div>'}<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="closeDraw()">太棒了</button>${(user()?.drawTickets||0)>0?'<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeDraw();tryDraw()">再抽</button>':''}</div>`}
function closeDraw(){document.getElementById('dov').className='hidden';document.getElementById('dov').innerHTML='';renderHome()}
function go(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');if(n==='home')renderHome();if(n==='users')renderUsers();if(n==='bank')renderBank();if(n==='gallery')renderGal();if(n==='lb')renderLB()}
function toast(m,ms=2500){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),ms)}
function setM(m){Q.mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===m))}
function renderHome(){const u=user();const un=document.getElementById('uname'),us=document.getElementById('ustats'),us2=document.getElementById('ustats2');
if(u){un.textContent=u.name;us.style.display='';us2.style.display='';document.getElementById('s-xp').textContent=u.xp||0;document.getElementById('s-lv').textContent=lvl(u.xp||0).n;document.getElementById('s-card').textContent=owned(u)+'/'+S.cardPool.length;const t=(u.correct||0)+(u.wrong||0);document.getElementById('s-acc').textContent=t?Math.round((u.correct||0)/t*100)+'%':'0%';const d=dueWords(u);document.getElementById('s-srs').textContent=d.length;document.getElementById('s-draw').textContent=u.drawTickets||0;const b=document.getElementById('srs-banner');if(d.length){b.classList.remove('hidden');document.getElementById('srs-txt').textContent=d.length+' 個到期'}else b.classList.add('hidden')}else{un.textContent='尚未選擇';us.style.display='none';us2.style.display='none';document.getElementById('srs-banner').classList.add('hidden')}
const list=document.getElementById('glist');list.innerHTML=!S.groups.length?'<p class="muted">請先到題庫新增</p>':S.groups.map(g=>`<label style="display:flex;gap:8px;margin-bottom:8px;cursor:pointer"><input type="checkbox" class="gc" value="${g.id}" style="width:auto"/><span>${g.name} <span class="muted">(${g.words.length})</span></span></label>`).join('')}
function renderUsers(){const list=document.getElementById('ulist');if(!S.users.length){list.innerHTML='<p class="muted card">尚無用戶</p>';return}list.innerHTML=S.users.map(u=>{const active=u.id===S.activeUserId;return`<div class="card"><div class="flex-between"><div><strong>${u.name}</strong><div class="muted">${lvl(u.xp||0).n} · ${u.xp||0} XP · 圖鑑 ${owned(u)}</div></div><div style="display:flex;gap:8px">${active?'<span class="badge badge-sr">使用中</span>':`<button class="btn btn-primary" onclick="selU('${u.id}')">選擇</button>`}<button class="btn btn-ghost" onclick="delU('${u.id}')">刪除</button></div></div></div>`}).join('')}
function addUser(){const n=document.getElementById('nname').value.trim();if(!n)return toast('輸入名稱');const u={id:uid(),name:n,xp:0,correct:0,wrong:0,cards:{},drawTickets:1,srs:{},history:[]};S.users.push(u);if(!S.activeUserId)S.activeUserId=u.id;save();document.getElementById('nname').value='';toast('已建立');renderUsers()}
function selU(id){S.activeUserId=id;save();toast('已切換');go('home')}
function delU(id){if(!confirm('刪除?'))return;S.users=S.users.filter(u=>u.id!==id);if(S.activeUserId===id)S.activeUserId=S.users[0]?.id||null;save();renderUsers()}
function renderBank(){document.getElementById('awg').innerHTML=S.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')||'<option value="">請先新增題組</option>';const list=document.getElementById('gl');list.innerHTML=!S.groups.length?'<p class="muted">無</p>':S.groups.map(g=>`<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)"><div class="flex-between"><strong>${g.name}</strong><div style="display:flex;gap:6px"><span class="badge badge-r">${g.words.length}</span><button class="btn btn-ghost" style="padding:6px 10px" onclick="delG('${g.id}')">刪</button></div></div><div class="muted" style="font-size:.85rem;margin-top:4px">${g.words.slice(0,4).map(w=>w.answer).join('、')}${g.words.length>4?'…':''}</div></div>`).join('')}
function addGroup(){const n=document.getElementById('ngn').value.trim();if(!n)return toast('輸入名稱');S.groups.push({id:uid(),name:n,words:[]});save();document.getElementById('ngn').value='';toast('已新增');renderBank()}
function delG(id){if(!confirm('刪除題組?'))return;S.groups=S.groups.filter(g=>g.id!==id);save();renderBank()}
function addWord(){const gid=document.getElementById('awg').value,q=document.getElementById('awq').value.trim(),a=document.getElementById('awa').value.trim();if(!gid)return toast('先建題組');if(!q||!a)return toast('題目答案必填');S.groups.find(x=>x.id===gid).words.push({id:uid(),question:q,answer:a,pinyin:document.getElementById('awp').value.trim(),def:document.getElementById('awd').value.trim()});save();['awq','awa','awp','awd'].forEach(i=>document.getElementById(i).value='');toast('已新增');renderBank()}
function parseCSV(t){const lines=t.trim().split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];const rows=lines.map(line=>{const cols=[];let cur='',inq=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inq=!inq;continue}if(c===','&&!inq){cols.push(cur.trim());cur='';continue}cur+=c}cols.push(cur.trim());return cols});let start=0;const h=rows[0].map(x=>x.toLowerCase());const has=h.some(x=>/題目|答案|question|answer|詞|pinyin/.test(x));if(has)start=1;const qi=has?h.findIndex(x=>/題目|question|句子/.test(x)):0,ai=has?h.findIndex(x=>/答案|answer|詞/.test(x)):1,pi=has?h.findIndex(x=>/拼音|pinyin/.test(x)):-1,di=has?h.findIndex(x=>/釋義|意思|def/.test(x)):-1;const words=[];for(let i=start;i<rows.length;i++){const r=rows[i],q=r[qi>=0?qi:0]||'',a=r[ai>=0?ai:1]||'';if(!q||!a)continue;words.push({id:uid(),question:q,answer:a,pinyin:pi>=0?(r[pi]||''):'',def:di>=0?(r[di]||''):''})}return words}
function impCSV(){const fi=document.getElementById('csvf'),paste=document.getElementById('csvp').value.trim();let gn=document.getElementById('ign').value.trim();const doit=(text,hint)=>{const words=parseCSV(text);if(!words.length)return toast('無法解析');const name=gn||hint||'匯入 '+new Date().toLocaleDateString();S.groups.push({id:uid(),name,words});save();toast(`已匯入 ${words.length} 詞`);document.getElementById('csvp').value='';document.getElementById('ign').value='';fi.value='';renderBank()};if(fi.files[0]){const f=fi.files[0],r=new FileReader();r.onload=()=>doit(r.result,f.name.replace(/\.csv$/i,''));r.readAsText(f,'UTF-8')}else if(paste)doit(paste);else toast('請選檔或貼上')}
function renderGal(){const u=user(),own=u?.cards||{},tot=S.cardPool.length,cnt=owned(u);document.getElementById('gprog').textContent=`收集 ${cnt}/${tot}`;const ord={SSR:0,SR:1,R:2,N:3};const sorted=[...S.cardPool].sort((a,b)=>(ord[a.rarity]-ord[b.rarity])||a.name.localeCompare(b.name,'zh'));document.getElementById('ggrid').innerHTML=sorted.map(c=>{const has=(own[c.id]||0)>0,cf=RAR[c.rarity];return`<div class="collect-card ${has?'':'locked'}"><div style="height:4px;border-radius:2px;background:${cf.c};margin-bottom:8px"></div><div style="font-size:1.8rem">${has?(c.e||'🎴'):'🔒'}</div><div style="font-weight:600;margin:6px 0">${has?c.name:'？？？'}</div><span class="badge ${cf.b}">${cf.l}</span>${has?`<div class="muted" style="font-size:.75rem;margin-top:4px">×${own[c.id]}</div>`:'<div class="muted" style="font-size:.75rem">未獲得</div>'}</div>`}).join('')}
function startQuiz(){if(!user())return toast('請先選帳戶');const checks=[...document.querySelectorAll('.gc:checked')].map(c=>c.value);if(!checks.length)return toast('選題組');let pool=[];S.groups.filter(g=>checks.includes(g.id)).forEach(g=>g.words.forEach(w=>pool.push({...w,gn:g.name})));if(!pool.length)return toast('無詞彙');for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const cnt=parseInt(document.getElementById('qcount').value,10);if(cnt>0)pool=pool.slice(0,cnt);Q={qs:pool,i:0,ok:0,wrong:[],mode:Q.mode,done:false,srs:false};go('quiz');showQ()}
function startSRS(){const u=user();if(!u)return;let d=dueWords(u);if(!d.length)return toast('無待複習');for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}d=d.slice(0,15);Q={qs:d,i:0,ok:0,wrong:[],mode:'choice',done:false,srs:true};go('quiz');showQ()}
function showQ(){const q=Q.qs[Q.i],tot=Q.qs.length;document.getElementById('qprog').textContent=(Q.srs?'複習 ':'')+`第 ${Q.i+1}/${tot}`;document.getElementById('qbar').style.width=(Q.i/tot*100)+'%';document.getElementById('qq').innerHTML=q.question.replace(/_{2,}|…+|＿+/g,'<span class="word-blank">　　</span>');document.getElementById('qp').textContent=q.pinyin?'拼音：'+q.pinyin:'';document.getElementById('fb').classList.add('hidden');document.getElementById('nbtn').classList.add('hidden');Q.done=false;document.getElementById('qml').textContent=(Q.srs?'SRS · ':'')+({choice:'供詞 10選1',free:'自由輸入',speech:'語音默書'}[Q.mode]||'');['choice','free','speech'].forEach(id=>document.getElementById(id).classList.add('hidden'));if(Q.mode==='choice'||Q.srs){document.getElementById('choice').classList.remove('hidden');rendCh(q)}else if(Q.mode==='free'){document.getElementById('free').classList.remove('hidden');document.getElementById('fi').value='';document.getElementById('fi').focus()}else{document.getElementById('speech').classList.remove('hidden');document.getElementById('sres').textContent='';document.getElementById('ssub').disabled=true;stopSp()}}
function rendCh(q){const all=[];S.groups.forEach(g=>g.words.forEach(w=>{if(w.answer!==q.answer&&!all.includes(w.answer))all.push(w.answer)}));for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}let opts=[q.answer,...all.slice(0,9)];while(opts.length<Math.min(10,all.length+1))opts.push(all[opts.length%Math.max(1,all.length)]);for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}document.getElementById('choice').innerHTML=opts.map(o=>`<button class="option-btn" data-a="${o}" onclick="subCh(this)">${o}</button>`).join('')}
function norm(s){return(s||'').trim().replace(/\s+/g,'').toLowerCase()}
function check(ans){if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],ok=norm(ans)===norm(q.answer),u=user();if(ok){Q.ok++;sfx('ok')}else{Q.wrong.push(q);sfx('bad')}if(u)updSRS(u,q.id,ok);const el=document.getElementById('fb');el.classList.remove('hidden');el.style.background=ok?'rgba(52,211,153,.12)':'rgba(248,113,113,.12)';el.style.border=`1px solid ${ok?'var(--success)':'var(--danger)'}`;el.innerHTML=ok?'<strong style="color:var(--success)">✓ 正確</strong>':`<strong style="color:var(--danger)">✕ 錯</strong><br>你的：${ans||'（空）'}<br>正確：<strong>${q.answer}</strong>${q.def?'<br>釋義：'+q.def:''}`;document.getElementById('nbtn').classList.remove('hidden');document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true)}
function subCh(btn){const a=btn.dataset.a,q=Q.qs[Q.i],ok=norm(a)===norm(q.answer);document.querySelectorAll('.option-btn').forEach(b=>{if(norm(b.dataset.a)===norm(q.answer))b.classList.add('correct');else if(b===btn&&!ok)b.classList.add('wrong')});check(a)}
function subFree(){check(document.getElementById('fi').value)}
function togSpeech(){if(listen){stopSp();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('請用 Chrome/Edge');rec=new SR();rec.lang=document.getElementById('slang').value||'zh-HK';rec.interimResults=true;rec.continuous=false;let ft='';rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)ft+=t;else it+=t}document.getElementById('sres').textContent=ft||it||'…';if(ft)document.getElementById('ssub').disabled=false};rec.onerror=e=>{toast('語音錯誤:'+e.error);stopSp()};rec.onend=()=>{listen=false;document.getElementById('mic').classList.remove('listening');document.getElementById('mic').textContent='🎤'};rec.start();listen=true;document.getElementById('mic').classList.add('listening');document.getElementById('mic').textContent='⏹';document.getElementById('sres').textContent='聆聽中…'}
function stopSp(){if(rec)try{rec.stop()}catch(_){ }listen=false;const b=document.getElementById('mic');if(b){b.classList.remove('listening');b.textContent='🎤'}}
function subSpeech(){const a=document.getElementById('sres').textContent;stopSp();check(a)}
function nextQ(){if(Q.i<Q.qs.length-1){Q.i++;showQ()}else finish()}
function finish(){stopSp();const u=user();if(!u)return go('home');const tot=Q.qs.length,xp=Q.ok*10+(Q.ok===tot?25:0),old=lvl(u.xp||0).n;u.xp=(u.xp||0)+xp;u.correct=(u.correct||0)+Q.ok;u.wrong=(u.wrong||0)+(tot-Q.ok);let tk=1;if(Q.ok/tot>=.8)tk++;if(Q.ok===tot)tk++;u.drawTickets=(u.drawTickets||0)+tk;save();
document.getElementById('rc').textContent=Q.ok;document.getElementById('rt').textContent=tot;document.getElementById('ra').textContent=Math.round(Q.ok/tot*100)+'%';document.getElementById('rx').textContent=xp;document.getElementById('rlu').classList.toggle('hidden',old===lvl(u.xp).n);document.getElementById('rd').textContent=`獲得 ${tk} 次抽卡（剩 ${u.drawTickets}）`;document.getElementById('rdb').style.display=u.drawTickets>0?'':'none';go('result')}
function retryWrong(){if(!Q.wrong.length)return toast('無錯題');Q.qs=[...Q.wrong];Q.i=0;Q.ok=0;Q.wrong=[];Q.done=false;go('quiz');showQ()}
function renderLB(){const sorted=[...S.users].sort((a,b)=>(b.xp||0)-(a.xp||0));document.getElementById('lbl').innerHTML=!sorted.length?'<p class="muted">無</p>':sorted.map((u,i)=>{const t=(u.correct||0)+(u.wrong||0),acc=t?Math.round((u.correct||0)/t*100):0;return`<div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border)"><div><span style="font-weight:700;margin-right:8px;color:#a78bfa">#${i+1}</span>${u.name}<div class="muted">${lvl(u.xp||0).n} · ${acc}% · 圖鑑 ${owned(u)}</div></div><div style="font-weight:700;color:var(--warning)">${u.xp||0} XP</div></div>`}).join('')}
function expB(){const d={version:3,exportedAt:new Date().toISOString(),...S};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`DP2_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();toast('已下載')}
function impB(){const f=document.getElementById('bf').files[0];if(!f)return toast('選檔');if(!confirm('覆蓋全部資料?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.groups)throw new Error('格式錯');S.users=d.users;S.groups=d.groups;S.cardPool=d.cardPool||S.cardPool;S.activeUserId=d.activeUserId||d.users[0]?.id||null;S.settings=d.settings||S.settings;save();toast('還原成功');go('home')}catch(e){toast('失敗:'+e.message)}};r.readAsText(f)}
function expCSV(){let csv='題組,題目,答案,拼音,釋義\n';S.groups.forEach(g=>g.words.forEach(w=>{csv+=[g.name,w.question,w.answer,w.pinyin||'',w.def||''].map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')+'\n'}));const b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`DP2_words_${new Date().toISOString().slice(0,10)}.csv`;a.click();toast('已匯出')}
function sfx(t){if(!S.settings.sfx&&!document.getElementById('sfx')?.checked)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=t==='ok'?880:t==='draw'?660:200;g.gain.value=.08;o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.stop(ctx.currentTime+.3)}catch(_){}}
load();document.getElementById('slang').value=S.settings.speechLang||'zh-HK';document.getElementById('sfx').checked=S.settings.sfx!==false;document.getElementById('slang').onchange=e=>{S.settings.speechLang=e.target.value;save()};document.getElementById('sfx').onchange=e=>{S.settings.sfx=e.target.checked;save()};
if(!S.groups.length){S.groups.push({id:uid(),name:'範例成語',words:[{id:uid(),question:'雖然他們之前吵得很兇，但最後還是_____了。',answer:'言歸於好',pinyin:'yan4 gwai1 jyu1 hou2',def:'重新和好'},{id:uid(),question:'兩人一起克服困難，真正做到_____。',answer:'同甘共苦',pinyin:'tung4 gam1 gung6 fu2',def:'一同享福與受苦'},{id:uid(),question:'他們感情很好，簡直是_____。',answer:'情同手足',pinyin:'cing4 tung4 sau2 zuk1',def:'感情像兄弟一樣親密'},{id:uid(),question:'只要_____，終有成功的一天。',answer:'鍥而不捨',pinyin:'',def:'堅持不懈'},{id:uid(),question:'這件事要成功，必須_____。',answer:'持之以恆',pinyin:'',def:'堅持到底'}]});save()}renderHome();
</script>
